name: Release

on:
  push:
    # Accept both `v1.2.3` and `1.2.3` tag styles. The version-verify
    # step below enforces semver shape + match against VERSION file.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  # See ci.yml — `cyrius deps` shadows the version-pinned snapshot
  # with cwd lib (identical content); silence the informational note.
  CYRIUS_NO_WARN_SHADOW_LIB: "1"
  # Whole-program dead-code elimination — smaller release binary.
  CYRIUS_DCE: "1"

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & Release
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version
        run: |
          FILE_VERSION=$(tr -d '[:space:]' < VERSION)
          TAG="${GITHUB_REF_NAME#v}"   # strip optional leading 'v' so v2.6.0 == 2.6.0
          echo "$TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "tag ($TAG) is not semver x.y.z"; exit 1; }
          [ "$FILE_VERSION" = "$TAG" ] || {
            echo "VERSION ($FILE_VERSION) != tag ($TAG)"; exit 1; }
          grep -q '^version = "\${file:VERSION}"' cyrius.cyml || {
            echo "cyrius.cyml version must be \${file:VERSION}"; exit 1; }
          echo "Version verified: $TAG (cyrius.cyml pulls from VERSION via \${file:VERSION})"

      - name: Install Cyrius toolchain
        # Delegates to the upstream installer keyed on the cyrius.cyml
        # pin — lays out $HOME/.cyrius/{bin,lib} (binaries + stdlib
        # snapshot). See ci.yml for the rationale (replaces the pre-6.x
        # hand-rolled two-tarball extraction that probed for `bin/cc5`).
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Sync the pinned stdlib snapshot
        # Cyrius 6.x: `lib sync --full` provisions ./lib/ from the pinned
        # snapshot; `cyrius deps` only OVERLAYS [deps.NAME] on top. deps alone
        # against an empty ./lib/ fails on the stdlib leaves each dep's
        # dist/<pkg>.deps sidecar names.
        # Its error claims the module "is not in the cyrius stdlib" — that is
        # false; filed as cyrius 2026-08-12-agnosai-deps-misleading-stdlib-error.
        run: cyrius lib sync --full

      - name: Resolve deps
        run: cyrius deps

      - name: Verify dep hashes
        run: |
          if [ -f cyrius.lock ]; then
            cyrius deps --verify
          else
            echo "::warning::cyrius.lock not committed — skipping hash verification"
          fi

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/bote
          echo "bote: $(wc -c < build/bote) bytes"

      - name: Regenerate dist bundles (consumer distribution artifacts)
        # Downstream consumers (phylax / t-ron / sutra / jalwa / rasa /
        # mneme) pull `dist/bote.cyr` via `[deps.bote] modules =
        # ["dist/bote.cyr"]`. A tagged release without it = broken
        # `cyrius deps` for every consumer. Mirrors libro / majra.
        #
        # ⚠ 3.3.7: BOTH bundles, not just the full one. ci.yml has gated
        # dist/bote-core.cyr since 2.7.2, but this workflow regenerated,
        # verified, archived and shipped only dist/bote.cyr — so a
        # core-profile consumer (t-ron's SecurityGate, nein's mcp module)
        # could be handed a tag whose core bundle was never checked and
        # never attached to the release. Found in the 3.3.7 staleness
        # sweep; the two workflows now gate the same set.
        run: |
          cyrius distlib || true
          cyrius distlib core || true
          test -s dist/bote.cyr      || { echo "FAIL: dist/bote.cyr not produced"; exit 1; }
          test -s dist/bote-core.cyr || { echo "FAIL: dist/bote-core.cyr not produced"; exit 1; }
          echo "dist/bote.cyr:      $(wc -l < dist/bote.cyr) lines, $(wc -c < dist/bote.cyr) bytes"
          echo "dist/bote-core.cyr: $(wc -l < dist/bote-core.cyr) lines, $(wc -c < dist/bote-core.cyr) bytes"

      - name: Verify dist bundles match committed copies
        run: |
          fail=0
          if ! git diff --exit-code dist/bote.cyr; then
            echo "FAIL: dist/bote.cyr is stale. Regenerate via 'cyrius distlib' and commit before tagging."
            fail=1
          fi
          if ! git diff --exit-code dist/bote-core.cyr; then
            echo "FAIL: dist/bote-core.cyr is stale. Regenerate via 'cyrius distlib core' and commit before tagging."
            fail=1
          fi
          exit $fail

      - name: Smoke test
        # bote's default entry is the stdio transport — it blocks
        # waiting on stdin, so we can't just `./build/bote`. Feed it
        # an MCP `initialize` request via stdin and check for a valid
        # JSON-RPC response on stdout.
        run: |
          out=$(printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}\n' | timeout 5 ./build/bote || true)
          echo "$out" | grep -q '"jsonrpc":"2.0"' || { echo "FAIL: bote stdio did not emit a JSON-RPC response"; echo "$out"; exit 1; }
          echo "OK: bote stdio responded"

      - name: Archive
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="bote-${TAG}/" -o "bote-${TAG}-src.tar.gz" HEAD
          cp build/bote     "bote-${TAG}-x86_64-linux"
          cp dist/bote.cyr      "bote-${TAG}.cyr"
          cp dist/bote-core.cyr "bote-${TAG}-core.cyr"
          sha256sum bote-*.tar.gz "bote-${TAG}-x86_64-linux" "bote-${TAG}.cyr" "bote-${TAG}-core.cyr" 2>/dev/null > SHA256SUMS

      - name: Extract changelog
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk "/^## \\[${TAG}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md > /tmp/body.md

      - uses: softprops/action-gh-release@v2
        with:
          name: "bote ${{ github.ref_name }}"
          body_path: /tmp/body.md
          prerelease: ${{ startsWith(github.ref_name, '0.') || startsWith(github.ref_name, 'v0.') }}
          files: |
            bote-*.tar.gz
            bote-*-linux
            bote-*.cyr
            cyrius.lock
            SHA256SUMS
