name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `cyrius deps` populates ./lib/ from the version-pinned snapshot,
  # which then shadows the global ~/.cyrius/versions/<V>/lib/ snapshot
  # on every subsequent `cyrius build` invocation. That's intentional
  # (the cwd lib IS the version-pinned content cyrius deps just
  # copied), but cyrius emits an informational note about it on
  # every build. Silence it across all CI steps. Same pattern as
  # majra / libro / agnosys CI post-5.10.x.
  CYRIUS_NO_WARN_SHADOW_LIB: "1"

  # Whole-program dead-code elimination — keeps the binary lean
  # and matches the first-party convention (agnosys / agnostik /
  # majra / libro).
  CYRIUS_DCE: "1"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        # The cyrius.cyml `[package].cyrius` pin is the single source of
        # truth for the toolchain version — nothing is hardcoded in this
        # YAML. Hand the pin to the upstream installer, which fetches +
        # lays out $HOME/.cyrius/{bin,lib}: binaries (cycc / cyrius /
        # cyrfmt / cyrlint ...) plus the stdlib snapshot, walking nested
        # lib/ subdirs. Replaces the hand-rolled two-tarball extraction
        # used through 2.7.2 — that path probed for `bin/cc5`, which the
        # 6.x toolchain renamed to `cycc`, breaking the install gate.
        # Same installer body as patra / agnosys on the 6.x toolchain.
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: cyrius --version

      - name: Sync the pinned stdlib snapshot
        # Cyrius 6.x: `lib sync --full` provisions ./lib/ from the pinned
        # snapshot; `cyrius deps` only OVERLAYS [deps.NAME] on top. deps alone
        # against an empty ./lib/ fails on the stdlib leaves each dep's
        # dist/<pkg>.deps sidecar names.
        # Its error claims the module "is not in the cyrius stdlib" — that is
        # false; filed as cyrius 2026-08-12-agnosai-deps-misleading-stdlib-error.
        run: cyrius lib sync --full

      - name: Resolve dependencies
        run: cyrius deps

      - name: Verify dep hashes
        # Skip on the first push that introduces a new dep before
        # cyrius.lock has been generated and committed. After it
        # lands in-tree, this step starts enforcing hash match.
        run: |
          if [ -f cyrius.lock ]; then
            cyrius deps --verify
          else
            echo "::warning::cyrius.lock not committed — skipping hash verification"
          fi

      - name: Manifest completeness ([lib] modules ⊇ main.cyr src/ includes)
        run: |
          # Every `include "src/<file>.cyr"` in src/main.cyr must be
          # listed under cyrius.cyml [lib] modules OR be in the
          # known-excluded set below. Otherwise `cyrius distlib`
          # silently ships a bundle missing a module. Mirrors
          # libro / majra.
          #
          # Excluded — entry-only helpers that belong to the binary,
          # not the public library surface. Including them in [lib]
          # modules would publish internal CLI / dispatcher-setup
          # helpers into dist/bote.cyr where consumers don't want
          # them.
          EXCLUDES=$(printf '%s\n' \
            "src/main_common.cyr" \
            | sort -u)
          INCLUDES=$(grep -E 'include "src/[^"]+\.cyr"' src/main.cyr \
            | grep -v "^#" \
            | sed -E 's/.*"(src\/[^"]+\.cyr)".*/\1/' | sort -u)
          MANIFEST=$(awk '/^\[lib\]/{flag=1;next} /^\[/{flag=0} flag' cyrius.cyml \
            | grep -oE '"src/[^"]+\.cyr"' | tr -d '"' | sort -u)
          REQUIRED=$(comm -23 <(echo "$INCLUDES") <(echo "$EXCLUDES"))
          MISSING=$(comm -23 <(echo "$REQUIRED") <(echo "$MANIFEST"))
          if [ -n "$MISSING" ]; then
            echo "FAIL: src/ files included from main.cyr but not in cyrius.cyml [lib] modules:"
            echo "$MISSING"
            echo
            echo "If this is a new entry-only helper (like main_common.cyr),"
            echo "add it to EXCLUDES above. Otherwise add it to [lib] modules."
            exit 1
          fi
          echo "Manifest covers all main.cyr src/ includes."
          echo "Excluded (entry-only): $(echo "$EXCLUDES" | tr '\n' ' ')"

      - name: Build
        run: |
          # pipefail is load-bearing: `cyrius build ... | tee` otherwise
          # masks a failed compile behind tee's exit 0, so a broken build
          # sailed through this step and only tripped the later "Verify
          # ELF" step with a confusing `build/bote: No such file`. With
          # pipefail the compile's non-zero status fails the step here.
          set -o pipefail
          mkdir -p build
          # CYRIUS_STATS=1 emits a machine-parseable capacity report
          # at the tail of stdout — feeds the capacity gate below.
          CYRIUS_STATS=1 cyrius build src/main.cyr build/bote 2>&1 | tee build/build.log
          echo "bote: $(wc -c < build/bote) bytes"

      - name: Verify ELF
        run: xxd -l 4 build/bote | grep -q "7f45 4c46"

      - name: Capacity gate
        # Compile-time resource gate. Cyrius prints utilisation under
        # `cyrius stats:` when CYRIUS_STATS=1 (see the build step).
        # We fail CI if fn_table or identifiers cross 95% — the cyrius
        # compiler itself warns at 85%, but the warning isn't load-bearing
        # so something has to enforce. 95% leaves ~5% headroom for a
        # mid-PR feature add before forcing the split conversation.
        #
        # If this gate fires, the response is one of:
        #   1. Land the cyrius cap raise upstream (preferred; the cap
        #      has moved before — 2048→4096 in cyrius 4.7.1).
        #   2. Split a transport into an opt-in compile unit (e.g.
        #      keep stdio + http in the default binary; ws / streamable
        #      / bridge pulled in via separate `include "src/transport_ws.cyr"`
        #      at the consumer's main.cyr).
        #   3. Feature-gate the unused config-setter surface behind
        #      `#ifdef BOTE_FULL_CONFIG` so the lean profile sheds
        #      ~30 setters that no in-tree consumer calls.
        # Inspect locally with `CYRIUS_STATS=1 cyrius build src/main.cyr
        # build/bote` — the `cyrius stats:` block at the tail of stdout
        # shows current utilisation.
        run: |
          if ! grep -q "^cyrius stats:" build/build.log; then
            echo "::warning::cyrius stats: line not found — CYRIUS_STATS may be unsupported on this toolchain. Skipping gate."
            exit 0
          fi
          fn_used=$(grep "^  fn_table:" build/build.log    | awk '{print $2}')
          fn_cap=$(grep  "^  fn_table:" build/build.log    | awk '{print $4}')
          id_used=$(grep "^  identifiers:" build/build.log | awk '{print $2}')
          id_cap=$(grep  "^  identifiers:" build/build.log | awk '{print $4}')
          fn_pct=$(( fn_used * 100 / fn_cap ))
          id_pct=$(( id_used * 100 / id_cap ))
          echo "fn_table:    $fn_used / $fn_cap  (${fn_pct}%)"
          echo "identifiers: $id_used / $id_cap  (${id_pct}%)"
          fail=0
          if [ "$fn_pct" -ge 95 ]; then
            echo "::error::fn_table at ${fn_pct}% — split / cap-raise required (gate threshold 95%)"
            fail=1
          fi
          if [ "$id_pct" -ge 95 ]; then
            echo "::error::identifier buffer at ${id_pct}% — split / cap-raise required (gate threshold 95%)"
            fail=1
          fi
          exit $fail

      - name: dist bundles are up-to-date
        # `cyrius distlib` reads cyrius.cyml [lib] / [lib.<profile>] modules and emits
        # dist/bote.cyr (default, full bundle) and dist/bote-core.cyr (opt-in core
        # profile, 2.7.2+) deterministically. Both committed bundles must match the
        # regenerated bundles byte-for-byte; otherwise a downstream consumer cloning
        # at our tag gets stale code under `cyrius deps`. Mirrors libro / majra.
        #
        # The `ulimit -v` cap that stood here from 3.3.8 is GONE — cyrius 6.6.3 fixed the
        # defect it contained. distlib's leaf-validation pass re-read every stdlib leaf for
        # every leaf, and cyrius's arena allocator never frees, so an O(n x m) read pattern
        # became O(n x m) RETAINED: measured peak RSS 31,214 MB on the full profile, which
        # OOM-killed the RUNNER and surfaced as "Error: The operation was canceled" two steps
        # before any assertion ran. The cap converted that into a contained non-zero exit.
        #
        # 6.6.3 caches the snapshot instead. Re-measured on the full profile, UNCAPPED, at the
        # 6.6.3 pin: peak RSS **120 MB**, rc=0 — a 260x reduction, comfortably inside a standard
        # runner's ~7 GB. Gated upstream by tests/gates/toolchain/distlib_leaf_lookup_memory.sh.
        #
        # ⭐ The `|| echo "::warning::"` and `|| true` that accompanied the cap are gone TOO.
        # They existed only because a capped run was EXPECTED to fail; leaving them would keep
        # this gate fail-open against a defect that no longer has an excuse. A distlib failure
        # here is now a real one, and it exits non-zero.
        run: |
          fail=0
          cyrius distlib
          test -s dist/bote.cyr || { echo "FAIL: dist/bote.cyr not produced"; exit 1; }
          if ! git diff --exit-code dist/bote.cyr; then
            echo "FAIL: dist/bote.cyr is stale. Run 'cyrius distlib' and commit."
            fail=1
          else
            echo "dist/bote.cyr matches src/ ($(wc -l < dist/bote.cyr) lines)"
          fi
          cyrius distlib core
          test -s dist/bote-core.cyr || { echo "FAIL: dist/bote-core.cyr not produced"; exit 1; }
          if ! git diff --exit-code dist/bote-core.cyr; then
            echo "FAIL: dist/bote-core.cyr is stale. Run 'cyrius distlib core' and commit."
            fail=1
          else
            echo "dist/bote-core.cyr matches src/ ($(wc -l < dist/bote-core.cyr) lines)"
          fi
          exit $fail

      - name: Run tests
        # Test files split across compilation units (bote.tcyr, plus
        # per-module bote_<mod>.tcyr) to stay under the cyrius
        # function-table cap. Run each in turn; fail fast on any
        # 'N failed' line that isn't '0 failed'.
        run: |
          fail=0
          for tcyr in tests/bote.tcyr \
                      tests/bote_auth.tcyr \
                      tests/bote_content.tcyr \
                      tests/bote_fs_tools.tcyr \
                      tests/bote_host.tcyr \
                      tests/bote_jwt.tcyr \
                      tests/bote_libro_tools.tcyr \
                      tests/bote_pkce.tcyr \
                      tests/bote_sandbox.tcyr \
                      tests/bote_streamable.tcyr \
                      tests/bote_transport_unix.tcyr \
                      tests/bote_web_tools.tcyr \
                      tests/bote_ws.tcyr \
                      tests/bote_core_only_smoke.tcyr; do
            echo "--- $tcyr ---"
            # 3.3.12: the exit code is checked. Through 3.3.11 `out=$(...)`
            # discarded it and only an explicit "N passed, M failed" with
            # M != 0 was flagged — so a file that failed to COMPILE, or
            # SIGSEGV'd before printing its summary, passed this step with
            # no output at all. Same class as cyrius 6.6.6's own runner fix
            # ("a binary that ran nothing scored a PASS").
            out=$(cyrius test "$tcyr" 2>&1); rc=$?
            tail=$(echo "$out" | tail -3)
            echo "$tail"
            if [ $rc -ne 0 ]; then
              echo "FAIL: $tcyr (exit $rc)"
              fail=1
            fi
            if echo "$out" | grep -qE '^[0-9]+ passed, [^0]'; then
              echo "FAIL: $tcyr"
              fail=1
            fi
            # Every file that calls assert_summary must print its line
            # with a non-zero pass count; the exit code alone cannot tell
            # "all passed" from "nothing ran". The core-only smoke is the
            # one exit-code-driven file and is exempt by that same test.
            if grep -q 'assert_summary' "$tcyr"; then
              if ! echo "$out" | grep -qE '^[1-9][0-9]* passed, 0 failed'; then
                echo "FAIL: $tcyr printed no passing summary line"
                fail=1
              fi
            fi
            # An `undefined function` on a unit that still links means a
            # call site nothing reaches — an include gap (3.3.12 found five
            # test files carrying one since the schema/codec split; the
            # fuzz step has gated this since 3.3.8).
            if echo "$out" | grep -q "undefined function"; then
              echo "FAIL: $tcyr compiles with undefined functions:"
              echo "$out" | grep -oE "undefined function '[a-z_0-9]*'" | sort -u
              fail=1
            fi
          done
          [ $fail -eq 0 ] || exit 1

      - name: Fuzz
        # Added 3.3.8. There was NO fuzz step: fuzz/*.fcyr was never run by CI, and
        # all four harnesses had silently stopped compiling at cyrius 6.1.25
        # (2026-06-10), when lib/json.cyr was carved into lib/bayan.cyr — four minors
        # of rot nothing could see. Two of them ALSO compiled with 18 undefined
        # functions and "passed" only because every call site was unreachable, so a
        # bare exit code would not have caught that half. Hence both assertions.
        run: |
          set -o pipefail
          fail=0
          for f in fuzz/*.fcyr; do
            [ -f "$f" ] || continue
            out=$(cyrius fuzz "$f" 2>&1) || fail=1
            echo "$out" | tail -3
            if echo "$out" | grep -qE "^[0-9]+ passed, [^0]"; then
              echo "FAIL: $f"; fail=1
            fi
            if echo "$out" | grep -q "undefined function"; then
              echo "FAIL: $f compiles with undefined functions:"
              echo "$out" | grep -oE "undefined function .[a-z_]*." | sort -u
              fail=1
            fi
          done
          [ $fail -eq 0 ] || exit 1
          echo "fuzz: all harnesses clean"

      - name: aarch64 portability gate
        # Added 3.2.0. bote had no aarch64 lane, and the gap let three
        # x86_64-only syscall constants reach `src/` and (via
        # src/session.cyr) the shipped dist/bote.cyr, breaking the
        # cross-build for bote and for every consumer that vendors the
        # bundle. See docs/development/issues/archive/2026-07-17-aarch64-sys-open-urandom.md.
        #
        # Two gates, both cheap and both deterministic (no emulator):
        #
        #   1. Denylist. lib/syscalls_x86_64_linux.cyr defines 96 SYS_*
        #      constants, lib/syscalls_aarch64_linux.cyr defines 91, and
        #      exactly 17 exist only on x86_64 — aarch64 Linux uses the
        #      generic table, which carries only the *at()/*at2() forms.
        #      Referencing one is a hard `undefined variable` error, not a
        #      warning, so this list is a build-break denylist. Comments
        #      are stripped first: the fix commit deliberately NAMES these
        #      constants in explanatory comments.
        #
        #   2. Cross-build all three entries. The denylist cannot catch a
        #      new x86-only symbol that upstream adds later, so the actual
        #      compile is the backstop.
        #
        # Not gated here: the full aarch64 TEST sweep, which needs
        # qemu-user. It was run locally at 3.2.0 — all 13 files, 786
        # assertions green on aarch64 — and `cyrius test --aarch64 <file>`
        # reproduces it wherever qemu-aarch64 is on PATH.
        run: |
          set -e
          X86_ONLY='SYS_(ACCESS|CHMOD|DUP2|EPOLL_WAIT|FORK|LINK|LSTAT|MKDIR|OPEN|PAUSE|PIPE|READLINK|RENAME|RMDIR|STAT|SYMLINK|UNLINK)\b'
          echo "--- denylist: x86_64-only SYS_* in src/ and dist/ ---"
          hits=$(sed 's/#.*//' src/*.cyr dist/*.cyr 2>/dev/null | grep -nE "$X86_ONLY" || true)
          if [ -n "$hits" ]; then
            echo "::error::x86_64-only SYS_* constant referenced — this breaks the aarch64 build."
            echo "$hits"
            echo
            echo "Use the arch-portable stdlib wrapper instead:"
            echo "  SYS_OPEN   -> sys_open(path, flags, mode)   (or random_bytes() for entropy)"
            echo "  SYS_UNLINK -> sys_unlink(path)"
            echo "  SYS_CHMOD  -> sys_chmod(path, mode)"
            exit 1
          fi
          echo "  clean — no x86_64-only SYS_* outside comments"
          echo "--- denylist: raw syscall(...) anywhere in bote's own sources ---"
          # Added 3.2.1 for src/ and the `syscall(SYS_*` spelling; widened
          # at 3.3.11 to ANY `syscall(` across src/, tests/, and fuzz/.
          # The x86-only constant denylist above only catches constants
          # that are x86-only TODAY. It could not have caught SYS_ACCEPT,
          # which is defined in NEITHER syscall peer — its only
          # definition is lib/net.cyr's bare `var SYS_ACCEPT = 43` (the
          # x86 number), so it resolved everywhere and worked on aarch64
          # only via the backend's runtime renumber chain, in which 43
          # would otherwise be statfs. And the 3.2.1 form could not have
          # caught a NUMERIC `syscall(60, rc)` — 60 is exit on x86_64
          # only — which is exactly what the toolchain's own tests carry.
          #
          # Every syscall bote needs has an arch-portable stdlib wrapper
          # (sys_open / sys_close / sys_read / sys_write / sys_socket /
          # sys_bind / sys_listen / sys_accept4 / sys_unlink / sys_chmod
          # / sys_exit / random_bytes), so nothing in-tree has a reason to
          # issue a raw syscall(). Banning the form is a stronger guard
          # than enumerating bad constants. Comments are stripped first,
          # so prose that names a syscall is fine.
          raw=$(for f in src/*.cyr tests/*.tcyr tests/*.bcyr fuzz/*.fcyr; do
            sed 's/#.*//' "$f" | grep -nE '\bsyscall[[:space:]]*\(' | sed "s|^|$f:|"
          done)
          if [ -n "$raw" ]; then
            echo "::error::raw syscall(...) — call the arch-portable stdlib wrapper instead."
            echo "$raw"
            exit 1
          fi
          echo "  clean — no raw syscall(...) in src/, tests/, or fuzz/"
          echo "--- cross-build ---"
          for e in main:bote main_streamable:bote-streamable main_ws:bote-ws; do
            src="${e%%:*}"; out="${e##*:}"
            cyrius build --aarch64 "src/$src.cyr" "build/$out-aarch64"
            # ELF e_machine at offset 0x12 must be 0xB7 (EM_AARCH64), little-endian.
            mach=$(od -An -tx1 -j18 -N2 "build/$out-aarch64" | tr -d ' ')
            [ "$mach" = "b700" ] || { echo "::error::$out-aarch64 is not EM_AARCH64 (e_machine=$mach)"; exit 1; }
            echo "  OK  build/$out-aarch64  ($(wc -c < "build/$out-aarch64") bytes, EM_AARCH64)"
          done

      - name: agnos portability gate
        # Added 3.3.12. bote has carried a CYRIUS_TARGET_AGNOS arm since the
        # Unix transport learned to fail-close there, but nothing built for
        # the target, so nothing could see it rot. Two gates, both
        # compile-time — an agnos binary cannot run on the runner, and the
        # toolchain's own scripts/agnos-crossbuild-gate.sh validates
        # behaviour on the agnos QEMU image, not here:
        #
        #   1. All three entries cross-build to a valid agnos ring-3 binary
        #      (static x86-64 ET_EXEC ELF: magic 7f454c46, e_type 0x0002,
        #      e_machine 0x003e) with ZERO `undefined function` lines,
        #      reachable or not. cycc lowers an unreachable undefined fn to a
        #      ud2 stub and still exits 0, so "OK" alone is not the bar —
        #      the day a call site becomes reachable it is a SIGILL.
        #   2. Every test, bench and fuzz unit compiles for the target with
        #      the same zero-undefined bar. bote_transport_unix.tcyr guards
        #      its sys_accept4 probe by #ifndef, exactly as the accept loop
        #      it exercises is guarded; it must still BUILD.
        run: |
          set -o pipefail
          fail=0
          echo "--- entries ---"
          for e in main:bote main_streamable:bote-streamable main_ws:bote-ws; do
            src="${e%%:*}"; out="${e##*:}"; log="build/$out-agnos.log"
            if ! cyrius build --agnos "src/$src.cyr" "build/$out-agnos" > "$log" 2>&1; then
              echo "::error::$out does not build for --agnos"; tail -5 "$log"; fail=1; continue
            fi
            magic=$(od -An -tx1 -N4 "build/$out-agnos" | tr -d ' ')
            etype=$(od -An -tx1 -j16 -N2 "build/$out-agnos" | tr -d ' ')
            mach=$(od -An -tx1 -j18 -N2 "build/$out-agnos" | tr -d ' ')
            if [ "$magic" != "7f454c46" ] || [ "$etype" != "0200" ] || [ "$mach" != "3e00" ]; then
              echo "::error::$out-agnos is not a static x86-64 ET_EXEC ELF (magic=$magic e_type=$etype e_machine=$mach)"
              fail=1
            fi
            if grep -q "undefined function" "$log"; then
              echo "::error::$out-agnos links with undefined functions (ud2 stubs at runtime):"
              grep -oE "undefined function '[a-z_0-9]*'" "$log" | sort -u
              fail=1
            fi
            echo "  OK  build/$out-agnos  ($(wc -c < "build/$out-agnos") bytes, ET_EXEC x86-64, 0 undefined)"
          done
          echo "--- test / bench / fuzz units (compile-only) ---"
          for f in tests/*.tcyr tests/*.bcyr fuzz/*.fcyr; do
            log="build/agnos-unit.log"
            if ! cyrius build --agnos "$f" build/agnos-unit.bin > "$log" 2>&1; then
              echo "::error::$f does not build for --agnos"; grep -E '^error' "$log" | head -5; fail=1; continue
            fi
            if grep -q "undefined function" "$log"; then
              echo "::error::$f compiles for --agnos with undefined functions:"
              grep -oE "undefined function '[a-z_0-9]*'" "$log" | sort -u
              fail=1
            fi
            echo "  OK  $f"
          done
          [ $fail -eq 0 ] || exit 1
          echo "agnos: all three entries + every unit build clean for CYRIUS_TARGET_AGNOS"

      - name: Build benchmarks (non-fatal)
        run: |
          if [ -f tests/bote.bcyr ]; then
            cyrius build tests/bote.bcyr build/bote_bench || exit 0
            ./build/bote_bench | tee bench-results.txt || exit 0
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: bote-${{ github.sha }}
          path: |
            build/bote
            bench-results.txt
          if-no-files-found: warn

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required docs
        run: |
          MISSING=0
          for doc in README.md CHANGELOG.md CLAUDE.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md LICENSE VERSION cyrius.cyml; do
            if [ -f "$doc" ]; then echo "  OK: $doc"; else echo "  MISSING: $doc"; MISSING=1; fi
          done
          exit $MISSING

      - name: Verify version consistency
        run: |
          FILE_VERSION=$(tr -d '[:space:]' < VERSION)
          CYML_VERSION=$(grep '^version = ' cyrius.cyml | head -1 | sed -E 's/version = "([^"]+)".*/\1/')
          # cyrius.cyml uses ${file:VERSION} — treat the literal as "match"
          if [ "$CYML_VERSION" != '${file:VERSION}' ] && [ "$CYML_VERSION" != "$FILE_VERSION" ]; then
            echo "FAIL: VERSION ($FILE_VERSION) != cyrius.cyml ($CYML_VERSION)"
            exit 1
          fi
          grep -q "\[$FILE_VERSION\]" CHANGELOG.md || { echo "FAIL: version $FILE_VERSION not in CHANGELOG.md"; exit 1; }
          echo "Version consistent: $FILE_VERSION"
