# What bote is known to fail of the 2026-07-28 requirement set of
# @modelcontextprotocol/conformance. scripts/conformance.sh fails on anything else that
# fails, and on anything here that passes. Each entry is a feature bote lacks.
server:
  # Every scenario the suite scores passes (3.8.2, with multi round-trip requests). Not
  # scored from here down.
  # inputSchema cannot carry root keywords such as $schema, $defs or
  # additionalProperties, because ToolSchema is type, properties and required. Roadmap 3.8.x.
  - json-schema-2020-12
  # The tasks extension is optional, and bote does not implement it.
  - tasks-capability-negotiation
  - tasks-dispatch-and-envelope
  - tasks-lifecycle
  - tasks-mrtr-composition
  - tasks-mrtr-input
  - tasks-request-headers
  - tasks-request-state-removal
  - tasks-required-task-error
  - tasks-wire-fields
